http:
  routers:
    backend-public-health-v1:
      entryPoints: [api-public]
      rule: Path(`/api/v1/health`)
      priority: 200
      middlewares: [security-headers, public-health-path, public-health-no-cache]
      service: backend

    backend-api-v1:
      entryPoints: [web, api-public]
      rule: Path(`/api/v1`) || PathPrefix(`/api/v1/`)
      priority: 100
      middlewares: [security-headers]
      service: backend

    frontend:
      entryPoints: [web]
      rule: PathPrefix(`/`) && !(Path(`/api`) || PathPrefix(`/api/`))
      priority: 1
      middlewares: [security-headers]
      service: frontend

  middlewares:
    public-health-path:
      replacePath:
        path: /health/live
    public-health-no-cache:
      headers:
        customResponseHeaders:
          Cache-Control: no-store

    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin

  services:
    backend:
      loadBalancer:
        healthCheck:
          path: /health/ready
          interval: 15s
          timeout: 5s
        servers:
          - url: http://backend:3000

    frontend:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 15s
          timeout: 5s
        servers:
          - url: http://frontend:8080
