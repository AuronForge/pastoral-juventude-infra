global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    project: pastoral-juventude

# Alertmanager is not part of development. Job names match production so the
# provisioned dashboards work in both.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # prometheus-node-exporter on the Ubuntu host, bound to 127.0.0.1:9100.
  - job_name: node
    static_configs:
      - targets: [host.docker.internal:9100]
        labels:
          instance: host

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: [backend:3000]

  - job_name: traefik
    static_configs:
      - targets: [traefik:8080]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
