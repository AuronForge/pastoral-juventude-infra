global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    project: pastoral-juventude

# Alertmanager and host/database exporters are not part of development.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: [backend:3000]

  - job_name: traefik
    static_configs:
      - targets: [traefik:8080]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
