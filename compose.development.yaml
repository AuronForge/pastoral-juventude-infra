name: pastoral-dev
services:
  traefik:
    restart: unless-stopped
    security_opt: &id001
      - no-new-privileges:true
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    image: traefik:v3.7.13
    command:
      - --configFile=/etc/traefik/traefik.yml
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.development.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - ${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_HTTP_PORT:-8080}:80
      - 127.0.0.1:${DEV_API_TUNNEL_PORT:-8082}:8082
  health-report:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    build:
      context: .
      dockerfile: docker/health-report/Dockerfile
    image: pastoral-health-report:1
    read_only: true
    environment:
      BACKEND_HEALTH_URL: http://backend:3000/health/ready
      HEALTH_REPORT_MAX_AGE_SECONDS: "180"
    volumes:
      - health-report-data:/data:ro
    networks:
      - app
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a validated development image}
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  backend:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a validated development image}
    entrypoint:
      - /bin/sh
      - /opt/pastoral/backend-entrypoint.sh
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: debug
      POSTGRES_DB: ${POSTGRES_DB:-pastoral}
      POSTGRES_USER: ${POSTGRES_USER:-pastoral}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      CORS_ORIGINS: ${DEV_CORS_ORIGINS:-${DEV_PUBLIC_URL:-http://localhost:8080}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - postgres_password
      - redis_password
      - jwt_public_key
      - jwt_private_key
    volumes:
      - ./scripts/backend-entrypoint.sh:/opt/pastoral/backend-entrypoint.sh:ro
    networks:
      - app
      - data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  postgres:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pastoral}
      POSTGRES_USER: ${POSTGRES_USER:-pastoral}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    image: pastoral-redis:8.6.6-1
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  migrate:
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE matching BACKEND_IMAGE}
    profiles:
      - tools
    restart: "no"
    entrypoint:
      - /bin/sh
      - /opt/pastoral/backend-entrypoint.sh
    command:
      - npm
      - run
      - prisma:migrate:deploy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pastoral}
      POSTGRES_USER: ${POSTGRES_USER:-pastoral}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    secrets:
      - postgres_password
      - redis_password
    volumes:
      - ./scripts/backend-entrypoint.sh:/opt/pastoral/backend-entrypoint.sh:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
networks:
  app: {}
  data:
    internal: true
volumes:
  postgres-data: {}
  redis-data: {}
  health-report-data: {}
secrets:
  postgres_password:
    file: ${SECRETS_DIR:-/opt/pastoral/dev/secrets}/postgres_password
  redis_password:
    file: ${SECRETS_DIR:-/opt/pastoral/dev/secrets}/redis_password
  jwt_private_key:
    file: ${SECRETS_DIR:-/opt/pastoral/dev/secrets}/jwt_private_key.pem
  jwt_public_key:
    file: ${SECRETS_DIR:-/opt/pastoral/dev/secrets}/jwt_public_key.pem

