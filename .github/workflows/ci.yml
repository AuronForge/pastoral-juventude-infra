name: CI

on:
  pull_request:
  push:
    branches: [main, develop, release]

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck jq

      - name: Prepare validation environment
        run: |
          cp .env.example .env
          sudo ./scripts/init-secrets.sh "$PWD/.ci-secrets"
          echo "SECRETS_DIR=$PWD/.ci-secrets" >> "$GITHUB_ENV"

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh docker/redis/*.sh docker/postgres-backup/*.sh

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          BACKEND_IMAGE=ghcr.io/auronforge/pastoral-juventude-backend:dev-ci \
          MIGRATION_IMAGE=ghcr.io/auronforge/pastoral-juventude-backend:dev-ci-migrations \
          FRONTEND_IMAGE=ghcr.io/auronforge/pastoral-juventude-frontend:dev-ci \
          docker compose -f compose.development.yaml config --quiet

      - name: Validate Desktop Compose
        env:
          BACKEND_IMAGE: ghcr.io/auronforge/pastoral-juventude-backend:dev-ci
          MIGRATION_IMAGE: ghcr.io/auronforge/pastoral-juventude-backend:dev-ci-migrations
          FRONTEND_IMAGE: ghcr.io/auronforge/pastoral-juventude-frontend:dev-ci
          DEV_RUNTIME_VOLUME: pastoral-dev_runtime-ci
        run: docker compose -f compose.development.yaml -f compose.development.desktop.yaml config --quiet

      - name: Validate development observability Compose
        env:
          BACKEND_IMAGE: ghcr.io/auronforge/pastoral-juventude-backend:dev-ci
          MIGRATION_IMAGE: ghcr.io/auronforge/pastoral-juventude-backend:dev-ci-migrations
          FRONTEND_IMAGE: ghcr.io/auronforge/pastoral-juventude-frontend:dev-ci
          DEV_RUNTIME_VOLUME: pastoral-dev_runtime-ci
        run: |
          docker compose -f compose.development.yaml -f compose.development.observability.yaml config --quiet
          docker compose -f compose.development.yaml -f compose.development.desktop.yaml \
            -f compose.development.observability.yaml -f compose.development.observability.desktop.yaml config --quiet

      - name: Validate Grafana dashboards
        run: |
          for dashboard in grafana/provisioning/dashboards/pastoral/*.json; do
            python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); assert d["uid"] and d["panels"], sys.argv[1]' "$dashboard"
          done

      - name: Test internal E2E origins
        run: python3 scripts/test-development-origins.py

      - name: Test automatic validated E2E selection
        run: python3 scripts/test-development-e2e.py

      - name: Test explicit daemon selection
        run: bash scripts/test-development-docker.sh

      - name: Test Desktop runtime portability
        run: bash scripts/test-desktop-runtime.sh

      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          --volume "$PWD/prometheus:/etc/prometheus:ro"
          --entrypoint /bin/promtool
          prom/prometheus:v3.14.0
          check config /etc/prometheus/prometheus.yml /etc/prometheus/prometheus.development.yml

      - name: Validate Loki configuration
        run: >-
          docker run --rm
          --volume "$PWD/loki/loki.yml:/etc/loki/loki.yml:ro"
          grafana/loki:3.7.7
          -config.file=/etc/loki/loki.yml
          -verify-config=true

      - name: Validate Alloy configuration
        run: |
          docker run --rm \
            --volume "$PWD/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.19.2 \
            fmt /etc/alloy/config.alloy > /tmp/config.alloy
          diff --unified alloy/config.alloy /tmp/config.alloy
          docker run --rm \
            --volume "$PWD/alloy/config.development.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.19.2 \
            fmt /etc/alloy/config.alloy > /tmp/config.development.alloy
          diff --unified alloy/config.development.alloy /tmp/config.development.alloy

      - name: Build custom images
        run: docker compose build redis postgres-backup

      - name: Test Redis startup and authentication
        run: bash scripts/test-redis.sh

      - name: Test versioned Traefik routing
        run: python3 scripts/test-traefik-routing.py

      - name: Test development diagnostics
        run: python3 scripts/test-health-development.py

      - name: Test archived Desktop retry safety
        run: python3 scripts/test-desktop-retry.py


      - name: Test public resource health report
        run: |
          node --test docker/health-report/server.test.mjs
          python3 scripts/test-publish-health-report.py
          python3 scripts/test-health-report-container.py
